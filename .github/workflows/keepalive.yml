name: Keep HotRoute Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hotroute.onrender.com/api/health)

          echo "Status Code: $STATUS"

          if [ "$STATUS" != "200" ]; then
            exit 1
          fi